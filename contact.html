<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =========================================
        ヘッダー
    ========================================== -->
    <header class="header">
        <div class="header__inner">
            <div class="header__logo">
                <a href="index.html">
                    <img src="img/logo.png" alt="Luminaロゴ">
                </a>
            </div>
            <nav class="header__nav">
                <ul class="header__list">
                    <li class="header__item">
                        <a href="index.html">
                            HOME
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="archive.html?category=interior">
                            Interior
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="archive.html?category=coffee">
                            Coffee
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="archive.html?category=recipe">
                            Recipe
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="about.html">
                            About
                        </a>
                    </li>
                </ul>
            </nav>

            <button type="button" class="header__hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- =========================================
        ページヘッダー
    ========================================== -->
    <section class="contact-pageheader l-section">
        <div class="contact-pageheader__inner l-inner">
            <h1 class="contact-pageheader__title c-title">
                Contact
            </h1>
            <p class="contact-pageheader__sub">
                ご質問やご相談など、お気軽にお問い合わせください
            </p>
        </div>
    </section>

    <!-- =========================================
        お問い合わせフォーム
    ========================================== -->
    <section class="contact-form l-section">
        <div class="contact-form__inner l-inner">
            <form action="#" method="post" class="contact-form__box">
                <dl class="contact-form__list">

                    <!-- 名前 -->
                    <div class="contact-form__item">
                        <dt class="contact-form__label">
                            <label for="name">
                                お名前
                            </label>
                            <span class="contact-form__tag">
                                必須
                            </span>
                        </dt>
                        <dd class="contact-form__input">
                            <input type="text" id="name" name="name" required>
                        </dd>
                    </div>

                    <!-- メールアドレス -->
                    <div class="contact-form__item">
                        <dt class="contact-form__label">
                            <label for="mail">
                                メールアドレス
                            </label>
                            <span class="contact-form__tag">
                                必須
                            </span>
                        </dt>
                        <dd class="contact-form__input">
                            <input type="email" id="mail" name="mail" required>
                        </dd>
                    </div>

                    <!-- 種別 -->
                    <div class="contact-form__item">
                        <dt class="contact-form__label">
                            <label for="category">
                                お問い合わせ種別
                            </label>
                            <span class="contact-form__tag contact-form__tag_optional">
                                選択
                            </span>
                        </dt>
                        <dd class="contact-form__input">
                            <select name="category" id="category" class="contact-form__select">
                                <option value="" hidden>
                                    選択してください
                                </option>
                                <option value="item1">
                                    ご意見・ご感想
                                </option>
                                <option value="item2">
                                    取材・お仕事のご依頼
                                </option>
                                <option value="item3">
                                    その他
                                </option>
                            </select>
                        </dd>
                    </div>

                    <!-- お問い合わせ内容 -->
                    <div class="contact-form__item">
                        <dt class="contact-form__label">
                            <label for="message">
                                お問い合わせ内容
                            </label>
                            <span class="contact-form__tag">
                                必須
                            </span>
                        </dt>
                        <dd class="contact-form__input">
                            <textarea name="message" id="message" class="contact-form__textarea">
                            </textarea>
                        </dd>
                    </div>

                    <!-- 送信ボタン -->
                    <div class="contact-form__btnbox">
                        <button type="submit" class="contact-form__btn">
                            送信
                        </button>
                    </div>

               </dl>
            </form>
        </div>
    </section>

    <!-- =========================================
        フッター
    ========================================== -->
    <footer class="footer">
        <div class="footer-inner">
            <div class="footer-imgbox">
                <img src="img/logo2.png" alt="Luminaロゴ">
            </div>

            <nav class="footer-nav">
                <ul class="footer-list">
                    <li class="footer-item">
                        <a href="#">HOME</a>
                    </li>
                    <li class="footer-item">
                        <a href="about.html">
                            ABOUT
                        </a>
                    </li>
                    <li class="footer-item">
                        <a href="contact.html">
                            CONTACT
                        </a>
                    </li>
                    <li class="footer-item">
                        <a href="privacy.html">
                            PRIVACY POLICY
                        </a>
                    </li>
                </ul>
            </nav>

            <p class="footer-copyrights">
                &copy; 2026 ecru. All Rights Reserved.
            </p>

        </div>
    </footer>

    <script src="js/main.js"></script>

</body>
</html>
