<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- =========================================
        ヘッダー
    ========================================== -->
    <header class="header">
        <div class="header__inner">
            <div class="header__logo">
                <a href="index.html">
                    <img src="img/logo.png" alt="Luminaロゴ">
                </a>
            </div>
            <nav class="header__nav">
                <ul class="header__list">
                    <li class="header__item">
                        <a href="index.html">
                            HOME
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="interior.html">
                            Interior
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="coffee.html">
                            Coffee
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="recipe.html">
                            Recipe
                        </a>
                    </li>
                    <li class="header__item">
                        <a href="about.html">
                            About
                        </a>
                    </li>
                </ul>
            </nav>

            <button type="button" class="header__hamburger" aria-label="メニューを開く">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- =========================================
        メインビジュアル
    ========================================== -->
    <!-- メインビジュアル（カルーセルスライダーエリア） -->
    <section class="top-mv">
        <div class="top-mv__inner">
    
            <!-- スライダー本体の枠 -->
            <div class="top-mv__slider">
      
                <!-- スライド1枚目 -->
                <div class="top-mv__slide is-active">
                    <div class="top-mv__media">
                        <img src="img/top-mv1.jpg" alt="自家製パンと極上コーヒー">
                    </div>
                    <div class="top-mv__content">
                        <span class="top-mv__category">
                            RECIPE
                        </span>
                        <h2 class="top-mv__title">
                            【特集】週末を彩る、自家製パンと極上コーヒーの心地よい時間
                        </h2>
                        <time class="top-mv__date" datetime="2026-09-01">
                            2026.09.01
                        </time>
                    </div>
                </div>

                <!-- スライド2枚目 -->
                <div class="top-mv__slide">
                    <div class="top-mv__media">
                        <img src="img/top-mv2.jpg" alt="心地よい空間をつくる北欧家具">
                    </div>
                    <div class="top-mv__content">
                        <span class="top-mv__category">
                            INTERIOR
                        </span>
                        <h2 class="top-mv__title">
                            心地よい空間をつくる、北欧家具とインテリアの選び方
                        </h2>
                        <time class="top-mv__date" datetime="2026-09-05">
                            2026.09.05
                        </time>
                    </div>
                </div>

                <!-- スライド3枚目 -->
                <div class="top-mv__slide">
                    <div class="top-mv__media">
                        <img src="img/top-mv3.jpg" alt="こだわりの淹れ方で楽しむ朝の一杯">
                    </div>
                    <div class="top-mv__content">
                        <span class="top-mv__category">
                            COFFEE
                        </span>
                        <h2 class="top-mv__title">
                            こだわりの淹れ方で楽しむ、極上の朝の一杯
                        </h2>
                        <time class="top-mv__date" datetime="2026-09-10">
                            2026.09.10
                        </time>
                    </div>
                </div>

            </div>

            <!-- 左右矢印ボタン -->
            <button class="top-mv__btn top-mv__btn--prev" aria-label="前へ">
                &lt;
            </button>
            <button class="top-mv__btn top-mv__btn--next" aria-label="次へ">
                &gt;
            </button>

            <!-- ドットインジケーター -->
            <div class="top-mv__dots">
                <span class="top-mv__dot is-active"></span>
                <span class="top-mv__dot"></span>
                <span class="top-mv__dot"></span>
            </div>

        </div>
    </section>

    <script src="js/main.js"></script>

</body>
</html>
